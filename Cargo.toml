[workspace]
resolver = "3"
members = ["core/*", "apps/node", "extensions/*", "vendor/beak/crates/*"]

[workspace.dependencies]
beak = { path = "vendor/beak/crates/beak" }
octoii-ai = { path = "core/octoii-ai" }
siphon = { path = "core/siphon" }
siphon-image = { path = "core/siphon-image" }
siphon-runtime = { path = "core/siphon-runtime" }
siphon-script = { path = "core/siphon-script" }
siphon-shell = { path = "core/siphon-shell" }
siphon-text = { path = "core/siphon-text" }
siphon-browser = { path = "extensions/siphon-browser" }
siphon-claude-code = { path = "extensions/siphon-claude-code" }
siphon-delegate = { path = "extensions/siphon-delegate" }
siphon-files = { path = "extensions/siphon-files" }
siphon-git = { path = "extensions/siphon-git" }
siphon-html = { path = "extensions/siphon-html" }
siphon-mcp = { path = "extensions/siphon-mcp" }
siphon-memory = { path = "extensions/siphon-memory" }
siphon-question = { path = "extensions/siphon-question" }
siphon-skills = { path = "extensions/siphon-skills" }
siphon-terminals = { path = "extensions/siphon-terminals" }
siphon-thread = { path = "extensions/siphon-thread" }
siphon-web-search = { path = "extensions/siphon-web-search" }

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Dependencies built optimized even in a debug build, as tests decode, resize and parse through them; our own code
# stays a debug build.
[profile.dev.package."*"]
opt-level = 2

# The tunnel's HTTP/3 at its newest commit — WebSocket over HTTP/3 (RFC 9220) is past its last release — and its
# endpoint from our fork, its crates all from one commit, upstream's names kept.
[patch.crates-io]
h3 = { git = "https://github.com/hyperium/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
iroh = { git = "https://github.com/octoii-works/iroh", rev = "15222d834e2118a046975753d3e48aeb8537875e" }
iroh-base = { git = "https://github.com/octoii-works/iroh", rev = "15222d834e2118a046975753d3e48aeb8537875e" }
iroh-dns = { git = "https://github.com/octoii-works/iroh", rev = "15222d834e2118a046975753d3e48aeb8537875e" }
iroh-relay = { git = "https://github.com/octoii-works/iroh", rev = "15222d834e2118a046975753d3e48aeb8537875e" }
