[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "vendor/beak/crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Dependencies built optimized even in a debug build, as tests decode, resize and parse through them; our own code
# stays a debug build.
[profile.dev.package."*"]
opt-level = 2

# The tunnel's HTTP/3 at its newest commit — WebSocket over HTTP/3 (RFC 9220) is past its last release — and its
# endpoint from our fork, its crates all from one commit, upstream's names kept.
[patch.crates-io]
h3 = { git = "https://github.com/hyperium/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
iroh = { git = "https://github.com/octoii-works/iroh", rev = "15222d834e2118a046975753d3e48aeb8537875e" }
iroh-base = { git = "https://github.com/octoii-works/iroh", rev = "15222d834e2118a046975753d3e48aeb8537875e" }
iroh-dns = { git = "https://github.com/octoii-works/iroh", rev = "15222d834e2118a046975753d3e48aeb8537875e" }
iroh-relay = { git = "https://github.com/octoii-works/iroh", rev = "15222d834e2118a046975753d3e48aeb8537875e" }
