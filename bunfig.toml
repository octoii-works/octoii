[install]
linker = "isolated"
hoist = false
exact = true
auto = "disable"
# Only install dependency versions published at least a day ago, so a compromised or broken release has time to be withdrawn.
minimumReleaseAge = 86400
# The Agent SDK follows the claude program, which updates daily; claude-agent is tested against the newest.
# The tunnel's packages are our own releases, taken as soon as they are published.
minimumReleaseAgeExcludes = [
	"@anthropic-ai/claude-agent-sdk",
	"@octoii-works/tunnel",
	"@octoii-works/tunnel-relay",
]

[test]
# Tests run per package (`bun run test`), never from the root.
root = "./do-not-run-tests-from-root"

[fmt]
# Format as oxfmt does; without it, bun fmt starts from Prettier's defaults.
flavor = "oxfmt"
useTabs = true
printWidth = 160
# What the node's types generate is kept as the generator writes it.
ignorePatterns = ["node_modules/", "dist/", "dist-hosted/", "apps/web/vendor/", ".claude/worktrees/", "packages/client/src/generated/"]
