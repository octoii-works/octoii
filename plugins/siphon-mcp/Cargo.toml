[package]
name = "siphon-mcp"
description = "MCP servers as Siphon's plugin: their tools a thread's model calls as its own, configured by the person and by a project — whose configuration runs once the person trusts it — each a command on the machine or a URL, connected as first needed and shared, and its catalog told the model"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
beak = { path = "../../vendor/beak/crates/beak" }
bytes = "1.12.1"
futures = "0.3.34"
http = "1"
octoii-ai = { path = "../../crates/octoii-ai" }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
siphon = { path = "../../crates/siphon" }
siphon-agent = { path = "../../crates/siphon-agent" }
siphon-machine = { path = "../../crates/siphon-machine" }
siphon-protocol = { path = "../../crates/siphon-protocol" }
siphon-runtime = { path = "../../crates/siphon-runtime" }
siphon-threads = { path = "../../crates/siphon-threads" }
siphon-tools = { path = "../../crates/siphon-tools" }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
