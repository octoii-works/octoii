[package]
name = "siphon"
description = "Siphon whole: the runtime on Beak with every program and handler of the agent, its tools, the MCP servers, the terminals and the browser, started as one"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
beak = { path = "../../vendor/beak/crates/beak" }
octoii-ai = { path = "../octoii-ai" }
siphon-accounts = { path = "../siphon-accounts" }
siphon-agent = { path = "../siphon-agent" }
siphon-machine = { path = "../siphon-machine" }
siphon-protocol = { path = "../siphon-protocol" }
siphon-runtime = { path = "../siphon-runtime" }
siphon-settings = { path = "../siphon-settings" }
siphon-threads = { path = "../siphon-threads" }
siphon-tools = { path = "../siphon-tools" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }
thiserror = "2.0.21"
tokio-util = "0.7.20"
nucleo-matcher = "0.3.1"
siphon-text = { path = "../siphon-text" }

[dev-dependencies]
siphon-tools = { path = "../siphon-tools" }
tempfile = "3.27.0"
ts-rs = "12.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
