[package]
name = "siphon"
description = "Siphon whole: the runtime on Beak with every program and handler of the agent, its tools, the MCP servers, the terminals and the browser, started as one"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
beak = { path = "../../vendor/beak/crates/beak" }
octoii-ai = { path = "../octoii-ai" }
siphon-agent = { path = "../siphon-agent" }
siphon-browser = { path = "../siphon-browser" }
siphon-machine = { path = "../siphon-machine" }
siphon-protocol = { path = "../siphon-protocol" }
siphon-runtime = { path = "../siphon-runtime" }
siphon-settings = { path = "../siphon-settings" }
siphon-terminals = { path = "../siphon-terminals" }
siphon-threads = { path = "../siphon-threads" }
siphon-tools = { path = "../siphon-tools" }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros"] }
tokio-util = "0.7.20"

[dev-dependencies]
bytes = "1.12.1"
siphon-machine = { path = "../siphon-machine" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
