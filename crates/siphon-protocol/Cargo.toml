[package]
name = "siphon-protocol"
description = "Siphon's protocol as a client speaks it over its WebSocket: the calls it makes, each answered once, and the events of what it subscribed to — its types the threads', the settings' and the vocabulary's own, described in TypeScript for the client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
octoii-ai = { path = "../octoii-ai" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
siphon-settings = { path = "../siphon-settings" }
siphon-threads = { path = "../siphon-threads" }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
