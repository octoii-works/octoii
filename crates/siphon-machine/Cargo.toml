[package]
name = "siphon-machine"
description = "The machine a piece of work reaches through a namespace of Beak's: paths as the model writes them, files read, written and edited, folders paged, programs run to their end, the repositories git tells of, and search over what the namespace shows"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
beak = { path = "../../vendor/beak/crates/beak" }
bytes = "1.12.1"
globset = "0.4.21"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
siphon-text = { path = "../siphon-text" }
thiserror = "2.0.21"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
futures = "0.3.34"
tokio = { version = "1.54.1", features = ["time", "macros", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-util"] }
