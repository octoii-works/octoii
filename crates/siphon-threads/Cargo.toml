[package]
name = "siphon-threads"
description = "Siphon's threads on Beak: each a directory of its run settings, its inbox, its log in segments and its processes; what changes how a thread runs logged by its main process alone, how a person keeps it marked on its directory"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
beak = { path = "../../vendor/beak/crates/beak" }
bytes = "1.12.1"
octoii-ai = { path = "../octoii-ai" }
siphon-image = { path = "../siphon-image" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
sha2 = "0.11.1"
siphon-runtime = { path = "../siphon-runtime" }
thiserror = "2.0.21"

[dev-dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
