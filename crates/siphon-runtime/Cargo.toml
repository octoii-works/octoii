[package]
name = "siphon-runtime"
description = "Siphon's runtime on Beak: programs run as Beak's processes, a phase at a time; the requests they make answered by handlers in tasks of their own or by a person; what streams while a request is answered, followed by topic"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
beak = { path = "../../vendor/beak/crates/beak" }
bytes = "1.12.1"
jsonschema = { version = "0.61.1", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3.27.0"
