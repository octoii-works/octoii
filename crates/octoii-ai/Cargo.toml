[package]
name = "octoii-ai"
description = "Octoii's access to models: one vocabulary of conversations in and out, the catalogue of models, and each provider's driver"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
async-stream = "0.3.6"
base64 = "0.23.1"
bytes = "1.12.1"
eventsource-stream = "0.2.3"
futures = "0.3.34"
http = "1.5.0"
httpdate = "1.0.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
parking_lot = "0.13.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
url = "2.5.8"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
