[package]
name = "siphon-settings"
description = "The settings a person sets: the environment's, on one directory's annotations, which every client shares and Siphon reads; and each device's, a document its client keeps, merged as a JSON merge patch"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
beak = { path = "../../vendor/beak/crates/beak" }
bytes = "1.12.1"
json-patch = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
siphon-runtime = { path = "../siphon-runtime" }
siphon-threads = { path = "../siphon-threads" }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
