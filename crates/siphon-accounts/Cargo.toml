[package]
name = "siphon-accounts"
description = "The providers models are reached through: the host's, then the accounts a person added of them — another key, sign-in or login — each a directory of the volume's, with a provider's quota used up kept till it is given again"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
beak = { path = "../../vendor/beak/crates/beak" }
bytes = "1.12.1"
octoii-ai = { path = "../octoii-ai" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
siphon-runtime = { path = "../siphon-runtime" }
siphon-threads = { path = "../siphon-threads" }
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
