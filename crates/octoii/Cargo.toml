[package]
name = "octoii"
description = "Octoii's node, the `octoii` program: Siphon and its core extensions on this computer, served to the person's clients on the loopback and through the tunnel, its Home kept"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "octoii"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
beak = { path = "../../vendor/beak/crates/beak" }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
gethostname = "1.1.0"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
octoii-ai = { path = "../octoii-ai" }
octoii-tunnel = { git = "https://github.com/octoii-works/octoii-tunnel", rev = "f6a52dbe0f3ab86215a2b304190d5867c5149ae6" }
qrcode = { version = "0.14.1", default-features = false }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
siphon = { path = "../siphon" }
siphon-browser = { path = "../../extensions/siphon-browser" }
siphon-machine = { path = "../siphon-machine" }
siphon-image = { path = "../siphon-image" }
siphon-claude-code = { path = "../../extensions/siphon-claude-code" }
siphon-mcp = { path = "../../extensions/siphon-mcp" }
siphon-protocol = { path = "../siphon-protocol" }
siphon-runtime = { path = "../siphon-runtime" }
siphon-terminals = { path = "../../extensions/siphon-terminals" }
siphon-threads = { path = "../siphon-threads" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
tokio-util = "0.7.20"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-br", "compression-zstd", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webbrowser = "1.2.6"
oauth2 = { version = "5.0.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
siphon-agent = { path = "../siphon-agent" }
siphon-settings = { path = "../siphon-settings" }
insta = "1.49.0"
siphon-threads = { path = "../siphon-threads" }
net = { package = "iroh", version = "1.4.1", features = ["test-utils"] }
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
