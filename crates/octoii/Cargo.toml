[package]
name = "octoii"
description = "Octoii's node, the `octoii` program: Siphon and its core plugins on this computer, served to the person's clients on the loopback and through the tunnel, its Home kept"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "octoii"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
beak = { path = "../../vendor/beak/crates/beak" }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
gethostname = "1.1.0"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
octoii-ai = { path = "../octoii-ai" }
octoii-tunnel = { git = "https://github.com/octoii-works/octoii-tunnel", rev = "f6a52dbe0f3ab86215a2b304190d5867c5149ae6" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
siphon = { path = "../siphon" }
siphon-browser = { path = "../../plugins/siphon-browser" }
siphon-machine = { path = "../siphon-machine" }
siphon-mcp = { path = "../../plugins/siphon-mcp" }
siphon-protocol = { path = "../siphon-protocol" }
siphon-runtime = { path = "../siphon-runtime" }
siphon-terminals = { path = "../../plugins/siphon-terminals" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["fs", "compression-br", "compression-zstd", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
net = { package = "iroh", version = "1.4.1", features = ["test-utils"] }
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
http = "1.5.0"
