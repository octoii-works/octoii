[package]
name = "siphon-tools"
description = "The tools a thread's model calls: each exec'd with what its call does to the machine weighed first — by its thread's mode, its project's grants, a second model or the person — and its output as the model reads it"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
beak = { path = "../../vendor/beak/crates/beak" }
bytes = "1.12.1"
globset = "0.4.21"
jsonschema = { version = "0.61.1", default-features = false }
octoii-ai = { path = "../octoii-ai" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
siphon-image = { path = "../siphon-image" }
siphon-machine = { path = "../siphon-machine" }
siphon-runtime = { path = "../siphon-runtime" }
siphon-shell = { path = "../siphon-shell" }
siphon-text = { path = "../siphon-text" }
siphon-threads = { path = "../siphon-threads" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }
tokio-util = "0.7.20"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
