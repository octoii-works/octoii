[package]
name = "beak"
description = "Beak for Rust: the kernel, its volume, namespaces and commands as safe async objects over Beak's C ABI, what happens to each a stream of its own"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["prebuilt"]
prebuilt = ["beak-sys/prebuilt"]

[dependencies]
beak-sys = { path = "../beak-sys", default-features = false }
bytes = "1.12.1"
parking_lot = "0.13.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "net"] }

[lints]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
