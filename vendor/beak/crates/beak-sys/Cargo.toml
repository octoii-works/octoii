[package]
name = "beak-sys"
description = "Beak's C ABI as Rust declares it, from include/beak.h: linked with the beak-c crate in its workspace, or with a distribution's built libbeak where `prebuilt` says so"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["prebuilt"]
# Links a distribution's static library — at BEAK_DIST, or the one this crate came in — as an open build links the
# closed one.
prebuilt = []

[lints]

[dependencies]

[build-dependencies]
bindgen = "0.73.2"
