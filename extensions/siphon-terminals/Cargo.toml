[package]
name = "siphon-terminals"
description = "The terminals of the threads, as tmux's server keeps its panes: each the person's login shell on a terminal Beak keeps, numbered in its thread, sized as its views ask, gone as its shell ends — owned by one task that tells of them as they change"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
octoii-ai = { path = "../../crates/octoii-ai" }
schemars = "1.2.3"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
siphon = { path = "../../crates/siphon" }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
