[package]
name = "siphon-browser"
description = "The browser of the threads: one headless Chromium spoken to over its DevTools pipe on Beak's channel, its pages each a thread's, painted for the person and read and acted on for the model"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
chromiumoxide_cdp = "0.9.1"
chromiumoxide_types = "0.9.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
octoii-ai = { path = "../../crates/octoii-ai" }
siphon = { path = "../../crates/siphon" }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
schemars = "1.2.3"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
