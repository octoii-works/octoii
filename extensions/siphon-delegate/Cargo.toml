[package]
name = "siphon-delegate"
description = "Sub-threads: the tasks a thread's model hands threads of its own, planned for its turn to give, waited on or given in the background"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
octoii-ai = { path = "../../crates/octoii-ai" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
siphon = { path = "../../crates/siphon" }

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
