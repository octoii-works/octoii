<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="referrer" content="no-referrer" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; script-src 'unsafe-inline' https: http:; style-src 'unsafe-inline' https: http:; frame-src blob:; img-src data: blob: https: http:; font-src data: blob: https: http:; media-src data: blob: https: http:; connect-src https: http:; base-uri 'none'; form-action 'none'"
		/>
		<title>HTML preview</title>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
				color-scheme: light dark;
			}
			iframe {
				display: block;
				width: 100%;
				height: 100%;
				border: 0;
				background: transparent;
			}
		</style>
	</head>
	<body>
		<script>
			(() => {
				const policy =
					"default-src 'none'; script-src 'unsafe-inline' https: http:; style-src 'unsafe-inline' https: http:; img-src data: blob: https: http:; font-src data: blob: https: http:; media-src data: blob: https: http:; connect-src https: http:; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'";
				let frame;
				let currentTheme;

				function content(theme) {
					const style = document.createElement("style");
					style.textContent = `
						:where(html) {
							color-scheme: light dark;
							--background: Canvas;
							--foreground: CanvasText;
							--card: var(--background);
							--popover: var(--card);
							--muted: color-mix(in srgb, var(--foreground) 8%, var(--background));
							--muted-foreground: light-dark(#616161, #b4b4b4);
							--border: color-mix(in srgb, var(--foreground) 18%, var(--background));
							--input: var(--border);
							--primary: light-dark(#2563eb, #93c5fd);
							--primary-foreground: light-dark(#ffffff, #172554);
							--accent: var(--primary);
							--ring: var(--primary);
							--error: #ef4444;
							--error-foreground: light-dark(#b91c1c, #fca5a5);
							--warning: #f59e0b;
							--warning-foreground: light-dark(#92400e, #fcd34d);
							--success: #10b981;
							--success-foreground: light-dark(#047857, #6ee7b7);
							--info: #3b82f6;
							--info-foreground: light-dark(#1d4ed8, #93c5fd);
							--card-foreground: var(--foreground);
							--popover-foreground: var(--foreground);
							--secondary: var(--muted);
							--secondary-foreground: var(--foreground);
							--accent-foreground: var(--primary-foreground);
							--accent-surface: color-mix(in srgb, var(--accent) 12%, var(--background));
							--accent-surface-foreground: var(--accent);
							--destructive: var(--error);
							--destructive-foreground: var(--error-foreground);
							--destructive-surface: color-mix(in srgb, var(--destructive) 12%, var(--background));
							--warning-surface: color-mix(in srgb, var(--warning) 12%, var(--background));
							--code-background: var(--muted);
							--code-foreground: var(--foreground);
							--chart-1: var(--accent);
							--chart-2: light-dark(#0d9488, #2dd4bf);
							--chart-3: light-dark(#d97706, #fbbf24);
							--chart-4: light-dark(#9333ea, #c084fc);
							--chart-5: light-dark(#e11d48, #fb7185);
							--chart-6: light-dark(#65a30d, #a3e635);
							--font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
							--font-mono: "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
							--radius: 0.625rem;
							--text-body: 14px;
							--text-body--line-height: 1.625;
							--text-heading-1: 16px;
							--text-heading-2: 15px;
							--text-heading-3: 14px;
							--text-heading--line-height: 1.3;
							background: var(--background);
							color: var(--foreground);
							font-family: var(--font-sans);
							font-size: var(--text-body);
							line-height: var(--text-body--line-height);
							padding: 8px;
							-webkit-font-smoothing: antialiased;
							-webkit-text-size-adjust: 100%;
							scrollbar-width: none;
						}
						*, ::before, ::after { box-sizing: border-box; }
						:where(body) { margin: 0; }
						:where(h1, h2, h3, h4, h5, h6) { font-weight: 600; line-height: var(--text-heading--line-height); }
						:where(h1) { font-size: var(--text-heading-1); }
						:where(h2) { font-size: var(--text-heading-2); }
						:where(h3, h4, h5, h6) { font-size: var(--text-heading-3); }
						:where(html)::-webkit-scrollbar { display: none; }
						:where(:focus-visible) { outline: 2px solid var(--ring); }
						:focus-visible { outline-width: 2px !important; outline-offset: -2px !important; }
						:where(pre, code, kbd, samp) { font-family: var(--font-mono); }
						:where(html) {}
					`;
					document.head.append(style);
					const themeStyle = style.sheet.cssRules[style.sheet.cssRules.length - 1].style;
					let pending = false;
					let previous = 0;
					const tell = () => {
						pending = false;
						const root = document.documentElement;
						const body = document.body;
						const bodyTop = body ? body.getBoundingClientRect().top + scrollY : 0;
						// The root's scrollHeight is at least the viewport, even after content shrinks.
						const height = Math.max(1, Math.ceil(Math.max(
							root.getBoundingClientRect().height,
							root.scrollHeight > root.clientHeight ? root.scrollHeight : 0,
							body ? bodyTop + Math.max(body.getBoundingClientRect().height, body.scrollHeight) : 0,
						)));
						if (height === previous) return;
						previous = height;
						parent.postMessage({ type: "octoii.html.size", height }, "*");
					};
					const queue = () => {
						if (pending) return;
						pending = true;
						requestAnimationFrame(tell);
					};
					const applyTheme = (next) => {
						themeStyle.cssText = "";
						if (next) {
							themeStyle.setProperty("color-scheme", next.appearance);
							for (const [name, value] of Object.entries(next.variables)) themeStyle.setProperty(name, value);
						}
						queue();
					};
					addEventListener("message", (event) => {
						if (event.source === parent && event.data?.type === "octoii.html.theme") applyTheme(event.data.theme);
					});
					applyTheme(theme);
					const observe = () => {
						const observer = new ResizeObserver(queue);
						observer.observe(document.documentElement);
						if (document.body) observer.observe(document.body);
						new MutationObserver(queue).observe(document.documentElement, {
							attributes: true,
							childList: true,
							characterData: true,
							subtree: true,
						});
						queue();
					};
					addEventListener("DOMContentLoaded", observe, { once: true });
					addEventListener("load", queue, { once: true });
					addEventListener("resize", queue);
				}

				function readTheme(value) {
					if (!value || (value.appearance !== "light" && value.appearance !== "dark")) return;
					if (!value.variables || typeof value.variables !== "object" || Array.isArray(value.variables)) return;
					if (Object.entries(value.variables).some(([name, token]) => !name.startsWith("--") || typeof token !== "string")) return;
					return value;
				}

				function sendTheme() {
					frame?.contentWindow.postMessage({ type: "octoii.html.theme", theme: currentTheme }, "*");
				}

				function load(html, theme) {
					currentTheme = theme;
					const prefix =
						'<!doctype html><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="' +
						policy +
						'"><script>(' +
						content.toString() +
						")(" + JSON.stringify(theme ?? null).replaceAll("<", "\\u003c") + ")</" +
						"script>";
					const next = document.createElement("iframe");
					next.title = "HTML content";
					next.sandbox = "allow-scripts";
					next.referrerPolicy = "no-referrer";
					next.srcdoc = prefix + html;
					next.addEventListener(
						"load",
						() => {
							if (frame !== next) return;
							sendTheme();
							parent.postMessage({ type: "octoii.html.loaded" }, "*");
						},
						{ once: true },
					);
					frame?.remove();
					frame = next;
					document.body.append(next);
				}

				addEventListener("message", (event) => {
					const message = event.data;
					if (message === null || typeof message !== "object") return;
					if (event.source === parent && message.type === "octoii.html.load" && typeof message.html === "string") {
						load(message.html, readTheme(message.theme));
						return;
					}
					if (event.source === parent && message.type === "octoii.html.theme") {
						const theme = readTheme(message.theme);
						if (!theme) return;
						currentTheme = theme;
						sendTheme();
						return;
					}
					if (
						event.source === frame?.contentWindow &&
						message.type === "octoii.html.size" &&
						typeof message.height === "number" &&
						Number.isFinite(message.height) &&
						message.height > 0
					) {
						parent.postMessage({ type: "octoii.html.size", height: Math.ceil(message.height) }, "*");
					}
				});
				parent.postMessage({ type: "octoii.html.ready" }, "*");
			})();
		</script>
	</body>
</html>
