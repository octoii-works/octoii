[package]
name = "siphon-git"
description = "Git: the repository a folder of the machine's is in, its changes, patches, versions and commits, as git tells of them, for the Diff view"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokio = { version = "1.54.1", features = ["sync"] }
anyhow = "1.0.104"
schemars = "1.2.3"
octoii-ai.workspace = true
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
octoii.workspace = true
thiserror = "2.0.21"
tokio-util = { version = "0.7.20", features = ["io"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
siphon-base.workspace = true
jsonschema = { version = "0.61.1", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
