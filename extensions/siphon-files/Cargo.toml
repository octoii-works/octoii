[package]
name = "siphon-files"
description = "Files a thread presents to the person: original bytes kept in the conversation and linked for download"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
octoii-ai = { path = "../../crates/octoii-ai" }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
siphon = { path = "../../crates/siphon" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
