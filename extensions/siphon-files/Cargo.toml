[package]
name = "siphon-files"
description = "Files a thread presents to the person: kept in the conversation for download, with local images embedded in HTML"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
octoii-ai.workspace = true
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
octoii.workspace = true
siphon-html.workspace = true
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
