name: Check

# Pushes to main, and pull requests into it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - run: bun run check
      # Pushes to main run the checks only; pull requests also build what the workspace builds.
      - if: github.event_name == 'pull_request'
        run: bun run build

  node:
    # The check above runs the tests on Node 24 as well as on Bun; this runs them on the newest Node too.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
      - run: node --version
      - run: bun run test:node

  rust:
    # Siphon, its extensions and the node, on macOS, the platform whose Beak library the repository holds: formatted,
    # linted and tested; then the client tested against the node itself, which needs the program built.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install
      - uses: ./.github/actions/setup-bun
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: bun run --filter ./packages/client test:against-node
