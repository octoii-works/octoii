[workspace]
resolver = "3"
members = ["crates/*", "vendor/beak/crates/*"]

[workspace.dependencies]
beak = { path = "vendor/beak/crates/beak" }
siphon-image = { path = "crates/siphon-image" }
siphon-runtime = { path = "crates/siphon-runtime" }
siphon-script = { path = "crates/siphon-script" }
siphon-shell = { path = "crates/siphon-shell" }
siphon-text = { path = "crates/siphon-text" }

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Dependencies built optimized even in a debug build, as tests decode, resize and parse through them; our own code
# stays a debug build.
[profile.dev.package."*"]
opt-level = 2
